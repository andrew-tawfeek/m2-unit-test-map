600px){.layout{display:flex;flex-direction:column;height:auto}#viewport{height:65vh}aside{height:40vh;border-top:1px solid #ccd8e4}.toolbar .spacer{display:none}header{padding:12px}h1{font-size:21px}}@media(prefers-reduced-motion:reduce){.node{transition:none}}@media print{header,.toolbar,aside{display:none}.layout{display:block;height:auto}#viewport{overflow:visible}#map{width:100%!important;height:auto!important}}

</style></head><body><header><div><h1>M2 engine · one test map</h1><p><a href="https://github.com/MichaelABurr/M2/tree/12ab6ecd492c40dfd53f579bee54b03df36ed495/M2/Macaulay2/e/unit-tests">arings @ 12ab6ecd492c</a> · 74 source/header files · Grouping from <a href="https://github.com/MichaelABurr/M2/pull/102">PR #102</a></p></div><div class="legend"><span><i class="line"></i>includes →</span><span><i class="line typed"></i>instantiates →</span></div></header><div class="toolbar"><input id="search" aria-label="Find a file, fixture or test" placeholder="Find a file, fixture, or test…"><span id="status" aria-live="polite">74 files</span><div class="spacer"></div><button id="minus" aria-label="Zoom out">−</button><span id="zoom">100%</span><button id="plus" aria-label="Zoom in">+</button><button id="fit">Fit map</button><button id="width">Fit width</button><button id="reset">Clear selection</button><label><input type="checkbox" id="edges" checked> Connections</label></div><div class="layout"><div id="viewport" tabindex="0" aria-label="Scrollable dependency map; drag the background to pan">__SVG__</div><div id="sidebar-divider" role="separator" aria-orientation="vertical" aria-label="Resize details sidebar" aria-controls="inspector" aria-valuemin="240" aria-valuemax="1000" aria-valuenow="350" tabindex="0" title="Drag to resize · Arrow keys to adjust · Double-click to reset"></div><aside id="inspector" aria-label="Selected file and hierarchy guide"></aside></div><script type="application/json" id="dataset">__DATA__</script><script>
const data=JSON.parse(document.getElementById('dataset').textContent),by=Object.fromEntries(data.map(d=>[d.name,d])),W=__WIDTH__,H=__HEIGHT__;
const $=id=>document.getElementById(id),svg=$('map'),vp=$('viewport'),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let scale=1,selected=null;
function resize(n,center=true){const x=(vp.scrollLeft+vp.clientWidth/2)/scale,y=(vp.scrollTop+vp.clientHeight/2)/scale;scale=Math.max(.12,Math.min(2,n));svg.style.width=W*scale+'px';svg.style.height=H*scale+'px';$('zoom').textContent=Math.round(scale*100)+'%';if(center){vp.scrollLeft=x*scale-vp.clientWidth/2;vp.scrollTop=y*scale-vp.clientHeight/2;}}
function fit(){resize(Math.min((vp.clientWidth-24)/W,(vp.clientHeight-24)/H),false);vp.scrollTop=vp.scrollLeft=0;}
function chips(ns){return '<div class="links">'+ns.map(n=>`<button data-file="${esc(n)}">${esc(n)}</button>`).join('')+'</div>'}
function local(d){return d.includes.map(i=>i.split('/').pop()).filter(n=>by[n]);}
function highlight(){const q=$('search').value.trim().toLowerCase(),matches=data.filter(d=>[d.name,...d.tests.map(t=>t.suite+'.'+t.name),...d.classes.map(c=>c.name)].join(' ').toLowerCase().includes(q)).map(d=>d.name);let related=new Set();if(selected){related=new Set([...local(by[selected]),...data.filter(d=>local(d).includes(selected)).map(d=>d.name)]);}
svg.querySelectorAll('.node').forEach(n=>{const name=n.dataset.name;n.classList.toggle('selected',selected===name);n.classList.toggle('related',related.has(name));n.classList.toggle('match',!!q&&matches.includes(name));n.classList.toggle('dim',q?!matches.includes(name):(selected?selected!==name&&!related.has(name):false));});svg.querySelectorAll('.edge').forEach(e=>{const hit=e.dataset.from===selected||e.dataset.to===selected;e.classList.toggle('active',hit);e.classList.toggle('dim',!!selected&&!hit);e.style.display=$('edges').checked?'':'none';});$('status').textContent=q?matches.length+' matching files':selected?'Neighborhood selected':'74 files';}
function guide(){$('inspector').innerHTML=`<h2>One map, three levels</h2><p>Start at the runtime hierarchy across the top. Follow the component groups below, then select a file to highlight its dependencies.</p><p class="hint">Drag empty space to pan. Scroll to move through the map. Use + / − to zoom. “Fit map” shows the whole structure; “Fit width” makes the labels larger.</p><h3>Runtime containment</h3><pre>Test program\n└─ Test suite\n   └─ Registered test\n      ├─ scopes / table rows\n      ├─ helper calls\n      └─ assertions</pre><h3>C++ inheritance</h3><pre>testing::Test\n└─ fixture class\n   └─ macro-generated test class</pre><p>The fixture owns or constructs engine objects. Each test gets a fresh fixture instance. The engine ring is not a GoogleTest base class.</p><h3>How M2 registers tests</h3><p><code>TEST</code>: ordinary test.<br><code>TEST_F</code>: uses a fixture.<br><code>TYPED_TEST</code>: repeats over a local type list.<br><code>TYPED_TEST_P</code>: reusable patterns instantiated by other files.</p><p>Templates and factories are supporting C++ code. They do not become runnable tests until used by a registered test.</p><h3>Two different arrow meanings</h3><p>In the file map, arrows point from a file to a header it includes. Orange arrows identify the QQ drivers that instantiate the reusable QQ suite. Within-file typed registration is described when you select the driver.</p><h3>Snapshot boundaries</h3><p>Source: <code>arings @ 12ab6ecd492c</code>. Sections use PR #102’s proposed directories. PR #104’s unmerged complex hierarchy is isolated at the bottom.</p><p><small>Counts are source macro declarations, not runtime test totals. Includes are direct textual dependencies, not a complete call graph. No engine tests were run to generate this map.</small></p><p><a href="https://google.github.io/googletest/primer.html">GoogleTest primer</a> · <a href="https://google.github.io/googletest/advanced.html#typed-tests">Typed tests</a></p>`;}
function select(name,focus=false){const d=by[name];if(!d)return;selected=name;highlight();const incoming=data.filter(x=>local(x).includes(name)).map(x=>x.name),out=local(d);const fixtures=d.classes.filter(c=>c.base.includes('testing::Test'));const typed=d.tests.filter(t=>t.kind.startsWith('TYPED'));$('inspector').innerHTML=`<small>${esc(d.displayPath)}</small><h2>${esc(name)}</h2><a href="${d.url}" target="_blank" rel="noreferrer">Read pinned source ↗</a><p>${d.tests.length} test declarations<br>${d.templates.length} template declaration excerpts</p>${fixtures.length?'<h3>Fixture inheritance</h3>'+fixtures.map(c=>`<pre>${esc(c.base)}\n└─ ${esc(c.name)}\n   └─ generated test subclasses</pre>`).join(''):''}${typed.length?'<p class="hint">This file defines '+typed.length+' typed test patterns. Runtime tests multiply by the selected concrete types.</p>':''}${name==='ARingQQTest.hpp'?'<p>Instantiated by the GMP and Flint drivers. The fixture owns <code>T mRing</code>; each driver supplies a <code>getElement</code> specialization.</p>':''}${name==='SMatTest.cpp'?'<p>Chooses 17 coefficient backends with <code>SMatRings</code>. <code>SMatRingFactory</code> constructs the ring; <code>SMatTest.hpp</code> defines the fixture.</p>':''}${name==='ARingZZpTest.cpp'?'<p><code>ZZpRing</code> selects ARingZZp, FFPACK, and Flint. <code>ARingFactory&lt;TypeParam&gt;</code> constructs supported ring/modulus pairs inside the tests.</p>':''}${name.startsWith('DMat')&&d.tests.length?'<p>These are ordinary registered tests calling reusable template helpers. A templated helper does not turn <code>TEST</code> into <code>TYPED_TEST</code>.</p>':''}<h3>Includes →</h3>${out.length?chips(out):'<small>No unit-test includes.</small>'}<h3>← Included by</h3>${incoming.length?chips(incoming):'<small>No unit-test includers.</small>'}${d.macros.length?'<h3>Registration / instantiation</h3>'+d.macros.map(m=>`<pre>${esc(m.text)}</pre>`).join(''):''}<h3>Tests grouped by suite</h3><p class="math-note">Each description states the property exercised by the source assertions. Disabled regressions state intended behavior, not a passing result.</p>${[...new Set(d.tests.map(t=>t.suite))].map(s=>`<details open><summary>${esc(s)}</summary>${d.tests.filter(t=>t.suite===s).map(t=>`<div class="test"><span class="pill">${t.kind}</span><strong>${esc(t.name)}</strong>${t.disabled?'<span class="pill disabled">Disabled · intended behavior</span>':''}<p class="test-description">${t.descriptionHtml}</p><a target="_blank" href="${d.url}#L${t.line}">source line ${t.line}</a></div>`).join('')}</details>`).join('')||'<p>No test declarations. This file supplies support code or declarations.</p>'}${d.templates.length?'<details><summary>Template declarations</summary>'+d.templates.map(t=>`<pre>${esc(t.text)}</pre><a href="${d.url}#L${t.line}" target="_blank">line ${t.line}</a>`).join('')+'</details>':''}<details><summary>Full source</summary><pre>${esc(d.source)}</pre></details><p><small>Build-source registration: CMake ${d.cmake?'listed':'not listed'}; Autotools ${d.make?'listed':'not listed'}. Headers may be used through includes without a source-list entry.</small></p>`;$('inspector').scrollTop=0;if(focus){const n=[...svg.querySelectorAll('.node')].find(n=>n.dataset.name===name),r=n.querySelector('rect');resize(Math.max(scale,.65));vp.scrollLeft=(+r.getAttribute('x')+230)*scale-vp.clientWidth/2;vp.scrollTop=(+r.getAttribute('y')+26)*scale-vp.clientHeight/2;}}
svg.addEventListener('click',e=>{const n=e.target.closest('.node');if(n)select(n.dataset.name);});svg.addEventListener('keydown',e=>{const n=e.target.closest('.node');if(n&&(e.key==='Enter'||e.key===' ')){e.preventDefault();select(n.dataset.name);}});$('inspector').addEventListener('click',e=>{const b=e.target.closest('[data-file]');if(b)select(b.dataset.file,true);});$('search').addEventListener('input',highlight);$('search').addEventListener('keydown',e=>{if(e.key==='Enter'){const n=svg.querySelector('.node.match');if(n)select(n.dataset.name,true);}});$('edges').onchange=highlight;$('plus').onclick=()=>resize(scale*1.25);$('minus').onclick=()=>resize(scale/1.25);$('fit').onclick=fit;$('width').onclick=()=>{resize((vp.clientWidth-24)/W,false);vp.scrollLeft=0;};$('reset').onclick=()=>{selected=null;$('search').value='';highlight();guide();};let drag=null;vp.addEventListener('pointerdown',e=>{if(e.target.closest('.node')||e.pointerType==='touch')return;drag={x:e.clientX,y:e.clientY,l:vp.scrollLeft,t:vp.scrollTop};vp.setPointerCapture(e.pointerId);vp.classList.add('dragging');});vp.addEventListener('pointermove',e=>{if(drag){vp.scrollLeft=drag.l+drag.x-e.clientX;vp.scrollTop=drag.t+drag.y-e.clientY;}});function end(){drag=null;vp.classList.remove('dragging');}vp.addEventListener('pointerup',end);vp.addEventListener('pointercancel',end);guide();fit();
</script><script src="sidebar.js"></script></body></html>
